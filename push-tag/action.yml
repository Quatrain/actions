name: 'Push Release Tag'
description: 'Bumps the version of package.json and pushes a git tag to trigger build & deployment'
inputs:
  bump_type:
    description: 'The type of version bump (patch, minor, major)'
    required: false
    default: 'patch'
  working_directory:
    description: 'The directory in which to execute the version bump'
    required: false
    default: '.'
  tag_prefix:
    description: 'The tag prefix to use. Set to "none" for no prefix (just "vX.Y.Z"), or leave default to use package name.'
    required: false
    default: 'default'
runs:
  using: 'composite'
  steps:
    - name: Configure Git
      shell: bash
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
    
    - name: Bump version
      shell: bash
      run: |
        cd ${{ inputs.working_directory }}
        npm --no-git-tag-version version ${{ inputs.bump_type }}
    
    - name: Get new version and name
      id: metadata
      shell: bash
      run: |
        cd ${{ inputs.working_directory }}
        VERSION=$(node -p "require('./package.json').version")
        NAME=$(node -p "require('./package.json').name")
        CLEAN_NAME=$(node -p "require('./package.json').name.split('/').pop()")
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "name=$NAME" >> $GITHUB_OUTPUT
        echo "clean_name=$CLEAN_NAME" >> $GITHUB_OUTPUT
        
    - name: Commit version bump
      shell: bash
      run: |
        cd ${{ inputs.working_directory }}
        git add package.json
        git commit -m "chore(release): publish v${{ steps.metadata.outputs.version }} of ${{ steps.metadata.outputs.name }} [skip ci]"
        
    - name: Push commit and tag
      shell: bash
      run: |
        PREFIX="${{ inputs.tag_prefix }}"
        if [ "$PREFIX" = "default" ] || [ -z "$PREFIX" ]; then
          PREFIX="${{ steps.metadata.outputs.clean_name }}-"
        elif [ "$PREFIX" = "none" ]; then
          PREFIX=""
        fi
        TAG_NAME="${PREFIX}v${{ steps.metadata.outputs.version }}"
        
        git tag -f "$TAG_NAME"
        git push origin HEAD
        git push origin "$TAG_NAME" -f
